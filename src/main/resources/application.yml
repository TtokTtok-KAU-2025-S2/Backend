spring:
  application:
    name: Backend

  # --- DB 설정 ---
  datasource:
    url: jdbc:mysql://dev-ttokttok.cjyuygmyir9b.ap-northeast-2.rds.amazonaws.com:3306/ttokttok
    username: root
    password: ${DB_PASSWORD} # ✅ 환경 변수 필요
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- JPA/Hibernate 설정 ---
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true
        format_sql: true
        use_sql_comments: true

  # --- 메일 설정 ---
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_EMAIL} # ✅ 환경 변수 필요
    password: ${SMTP_PASSWORD}     # ${SMTP_PASSWORD}  # ✅ 환경 변수 필요
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
