server:
  port:5000
# spring 포트를 5000으로 변경

spring:
  application:
    name: Backend

  # --- DB 설정 ---
  datasource:
    url: jdbc:mysql://dev-ttokttok.cjyuygmyir9b.ap-northeast-2.rds.amazonaws.com:3306/ttokttok
    username: root
    password: ${DB_PASSWORD}  # ✅ 환경 변수 필요
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- JPA/Hibernate 설정 ---
  jpa:
    hibernate:
      ddl-auto: update # 'create' 대신 'update' 사용 (수정됨)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true
        format_sql: true
        use_sql_comments: true

  # --- 메일 설정 ---
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_EMAIL} # ✅ 환경 변수 필요
    password:  ${SMTP_PASSWORD}  # ✅ 환경 변수 필요
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  
  
  ai:
    vertex:
      ai:
        gemini:
          # 1. (필수) Google Cloud 프로젝트 ID
          project-id: "gen-lang-client-0133965444"
          # 2. (필수) Vertex AI 리전 (예: us-central1)
          location: "us-central1"
          chat:
            options:
              # 3. 모델명 (요청하신 2.5 Flash)
              model: "gemini-2.5-flash-latest"
              temperature: 0.4

  # --- JWT 설정 ---
  jwt:
    secret: ${JWT_KEY}
    access-token-validity-in-seconds: 3600
    refresh-token-validity-in-seconds: 86400


  logging:
    level:
      org.springframework.security: DEBUG
      

    refresh-token-validity-in-seconds: 86400
